name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }} / ${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - eager-tools-core
          - eager-tools-anthropic
          - eager-tools-openai
          - eager-tools-langgraph

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        working-directory: packages/${{ matrix.package }}
        run: uv sync --extra dev

      - name: Ruff — lint
        working-directory: packages/${{ matrix.package }}
        run: uv run ruff check .

      - name: Ruff — format check
        working-directory: packages/${{ matrix.package }}
        run: uv run ruff format --check .

      - name: Pytest
        working-directory: packages/${{ matrix.package }}
        run: uv run pytest -v

  typecheck:
    name: typecheck (pyrefly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install core package
        working-directory: packages/eager-tools-core
        run: uv sync --extra dev

      - name: Pyrefly
        working-directory: packages/eager-tools-core
        run: uv run pyrefly check

  bench-smoke:
    name: bench harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install anthropic adapter (bench harness deps)
        working-directory: packages/eager-tools-anthropic
        run: uv sync --extra dev

      - name: Smoke-run smallest workload
        run: |
          uv run \
            --project packages/eager-tools-anthropic \
            --with-editable packages/eager-tools-core \
            python bench/run.py --workload analytics --runs 1 --no-write
