name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        package:
          - eager-tools-core
          - eager-tools-anthropic
          - eager-tools-openai

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        working-directory: packages/${{ matrix.package }}
        run: uv sync --extra dev

      - name: Ruff — lint
        working-directory: packages/${{ matrix.package }}
        run: uv run ruff check src tests

      - name: Ruff — format check
        working-directory: packages/${{ matrix.package }}
        run: uv run ruff format --check src tests

      - name: Pytest
        working-directory: packages/${{ matrix.package }}
        run: uv run pytest -v

  typecheck:
    name: typecheck (pyright strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install core package
        working-directory: packages/eager-tools-core
        run: uv sync --extra dev

      - name: Pyright
        uses: jakebailey/pyright-action@v2
        with:
          version: "1.1.370"
          working-directory: .

  bench-smoke:
    name: bench harness smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Skip until bench/ exists
        run: |
          if [ -f bench/run.py ]; then
            cd packages/eager-tools-core && uv sync --extra dev
            uv run python ../../bench/run.py --smoke
          else
            echo "bench/run.py not yet present — skipping"
          fi
