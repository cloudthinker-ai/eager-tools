[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eager-tools-core"
version = "0.2.0"
description = "Provider-agnostic core for eager tool calling — seal detector + async executor pool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudThinker", email = "hello@cloudthinker.io" }]
keywords = ["agent", "llm", "tool-calling", "streaming", "pipelining"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyrefly>=0.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://eager-tools.dev"
Repository = "https://github.com/eager-tools/eager-tools"
Issues = "https://github.com/eager-tools/eager-tools/discussions"

[tool.hatch.build.targets.wheel]
packages = ["src/eager_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
