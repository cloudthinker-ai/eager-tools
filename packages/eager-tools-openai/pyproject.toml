[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eager-tools-openai"
version = "0.2.0"
description = "OpenAI adapter for eager tool calling — wraps chat.completions streaming to emit SealEvents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudThinker", email = "hello@cloudthinker.io" }]
keywords = ["agent", "llm", "tool-calling", "streaming", "openai", "gpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["eager-tools-core>=0.2.0"]

[project.optional-dependencies]
dev = [
    "openai>=1.50",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pyrefly>=0.1",
]

[project.urls]
Homepage = "https://eager-tools.dev"
Repository = "https://github.com/eager-tools/eager-tools"
Issues = "https://github.com/eager-tools/eager-tools/discussions"

[tool.uv.sources]
eager-tools-core = { path = "../eager-tools-core", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/eager_tools_openai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
