<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img"
     aria-label="Diagram of the seal mechanism: streaming chunks accumulate in a buffer until a block-complete chunk fires a SealEvent that dispatches the tool.">
  <title>Seal mechanism: chunk → buffer → seal → dispatch</title>
  <desc>A top-to-bottom flow showing a stream of provider chunks (tool_use_start, three input_json_delta chunks carrying partial JSON, and a block_complete marker) feeding a SealDetector. The SealDetector accumulates the partial JSON until block_complete arrives, at which point it emits a SealEvent containing the full ToolCall. The SealEvent is consumed by an ExecutorPool that runs the tool concurrently with the rest of the model stream.</desc>

  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #111827; stroke: #1f2937; stroke-width: 1; }
      .header { fill: #f1f5f9; font: 700 16px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .sub { fill: #94a3b8; font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .label { fill: #cbd5e1; font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .mono { fill: #e2e8f0; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .mono-dim { fill: #94a3b8; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .chunk { fill: #1e293b; stroke: #334155; stroke-width: 1; }
      .chunk-start { stroke: #38bdf8; }
      .chunk-delta { stroke: #64748b; }
      .chunk-seal { stroke: #34d399; stroke-width: 1.5; }
      .seal-event { fill: #064e3b; stroke: #10b981; stroke-width: 1.5; }
      .pool { fill: #0c2a3b; stroke: #22d3ee; stroke-width: 1.5; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; }
      .arrow-fire { stroke: #10b981; stroke-width: 2; fill: none; }
      .arrowhead { fill: #475569; }
      .arrowhead-fire { fill: #10b981; }
      .accent { fill: #34d399; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="arrowhead"/>
    </marker>
    <marker id="ah-fire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" class="arrowhead-fire"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="500"/>

  <!-- header -->
  <text class="header" x="32" y="32">How a tool block seals</text>
  <text class="sub" x="32" y="52">Provider chunks accumulate until block_complete · seal event triggers eager dispatch</text>

  <!-- ===================== STAGE 1: provider stream ===================== -->
  <text class="label" x="32" y="92">1 · provider stream</text>

  <!-- 5 chunks centered: width 120, gap 16, total 664, margin (820-664)/2 = 78 -->
  <g transform="translate(78 102)">
    <rect class="chunk chunk-start" x="0" y="0" width="120" height="48" rx="4"/>
    <text class="mono" x="60" y="20" text-anchor="middle">tool_use_start</text>
    <text class="mono-dim" x="60" y="36" text-anchor="middle">id=tu_01</text>
  </g>
  <g transform="translate(214 102)">
    <rect class="chunk chunk-delta" x="0" y="0" width="120" height="48" rx="4"/>
    <text class="mono" x="60" y="20" text-anchor="middle">input_json_delta</text>
    <text class="mono-dim" x="60" y="36" text-anchor="middle">{"path":"/etc</text>
  </g>
  <g transform="translate(350 102)">
    <rect class="chunk chunk-delta" x="0" y="0" width="120" height="48" rx="4"/>
    <text class="mono" x="60" y="20" text-anchor="middle">input_json_delta</text>
    <text class="mono-dim" x="60" y="36" text-anchor="middle">/hosts","mode":</text>
  </g>
  <g transform="translate(486 102)">
    <rect class="chunk chunk-delta" x="0" y="0" width="120" height="48" rx="4"/>
    <text class="mono" x="60" y="20" text-anchor="middle">input_json_delta</text>
    <text class="mono-dim" x="60" y="36" text-anchor="middle">"r"}</text>
  </g>
  <g transform="translate(622 102)">
    <rect class="chunk chunk-seal" x="0" y="0" width="120" height="48" rx="4"/>
    <text class="mono" x="60" y="20" text-anchor="middle">block_complete</text>
    <text class="accent" x="60" y="36" text-anchor="middle">— SEAL —</text>
  </g>

  <!-- arrow: chunks → SealDetector -->
  <path class="arrow" d="M 410 158 L 410 196" marker-end="url(#ah)"/>

  <!-- ===================== STAGE 2: SealDetector ===================== -->
  <text class="label" x="32" y="220">2 · SealDetector buffers per-block, emits on completion</text>
  <g transform="translate(32 232)">
    <rect class="panel" x="0" y="0" width="756" height="104" rx="6"/>
    <text class="label" x="20" y="26">SealDetector</text>
    <text class="sub" x="20" y="44">id → _ToolBuffer { name, json_fragments[] }</text>
    <rect class="chunk chunk-delta" x="20" y="60" width="716" height="32" rx="3"/>
    <text class="mono" x="32" y="80">tu_01 → "read_file" · {"path":"/etc/hosts","mode":"r"}</text>
  </g>

  <!-- arrow-fire: SealDetector → SealEvent -->
  <path class="arrow-fire" d="M 410 346 L 410 394" marker-end="url(#ah-fire)"/>

  <!-- ===================== STAGE 3: SealEvent → ExecutorPool ===================== -->
  <!-- SealEvent (left) -->
  <g transform="translate(110 400)">
    <rect class="seal-event" x="0" y="0" width="280" height="76" rx="6"/>
    <text class="label" x="140" y="24" text-anchor="middle">SealEvent</text>
    <text class="mono" x="140" y="46" text-anchor="middle">ToolCall(id="tu_01",</text>
    <text class="mono" x="140" y="64" text-anchor="middle">name="read_file", input={...})</text>
  </g>

  <!-- arrow: SealEvent → ExecutorPool -->
  <path class="arrow-fire" d="M 390 438 L 430 438" marker-end="url(#ah-fire)"/>

  <!-- ExecutorPool (right) -->
  <g transform="translate(430 400)">
    <rect class="pool" x="0" y="0" width="280" height="76" rx="6"/>
    <text class="label" x="140" y="24" text-anchor="middle">ExecutorPool</text>
    <text class="sub" x="140" y="46" text-anchor="middle">async pool · idempotency gate</text>
    <text class="accent" x="140" y="64" text-anchor="middle">dispatches concurrently with stream</text>
  </g>
</svg>
